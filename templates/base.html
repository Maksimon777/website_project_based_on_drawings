{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Чертежи{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
<header>
    <a class="brand" href="{% url 'home' %}">ЧЕРТЕЖИ</a>
    <nav aria-label="Главное меню">
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}">Мой профиль</a>
            <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="secondary">Выйти</button></form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Войти</a>
            <a href="{% url 'accounts:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
<main>
    {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
